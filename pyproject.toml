[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verify-proof"
version = "0.2.3"
description = "Verify blockchain-anchored timestamp proofs (ProofLedger, OpenTimestamps) — CLI + MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Craig Solomon", email = "craig@fulcrumenterprises.tech"},
]
keywords = [
    "blockchain", "timestamp", "verification", "proof-of-existence",
    "sha256", "bitcoin", "polygon", "evidence", "copyright",
    "chain-of-custody", "digital-forensics", "proofledger",
]
classifiers = [
    # Beta rather than Alpha as of 0.2.3: the CLI surface has been stable
    # across four releases and the package has no runtime dependencies.
    # "Alpha" actively discourages adoption for anything load-bearing, which
    # is the wrong signal for a verification tool.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]

# Base install is dependency-free (Python standard library only).
# The MCP server is an optional extra: pip install "verify-proof[mcp]"
[project.optional-dependencies]
# Pinned below 2.0 deliberately. MCP SDK 2.0 removed mcp.server.fastmcp
# and renamed FastMCP to MCPServer under mcp.server.mcpserver, so the
# server module does not import against it. Port to the 2.0 API before
# lifting this pin.
mcp = ["mcp>=1.2.0,<2"]

[project.scripts]
verify-proof = "verify_proof:main"
verify-proof-mcp = "verify_proof_mcp:main"

[project.urls]
# Each of these renders as its own link in the PyPI sidebar, which is free
# real estate the package was not using.
Homepage = "https://github.com/Fulcrum-Enterprises/verify-proof"
Documentation = "https://github.com/Fulcrum-Enterprises/verify-proof#readme"
Issues = "https://github.com/Fulcrum-Enterprises/verify-proof/issues"
Changelog = "https://github.com/Fulcrum-Enterprises/verify-proof/releases"
"Proof format and API" = "https://proofledger.io/api.html"
ProofLedger = "https://proofledger.io"

[tool.setuptools]
py-modules = ["verify_proof", "verify_proof_mcp"]
