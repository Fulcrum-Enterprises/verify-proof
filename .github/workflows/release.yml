name: Release to PyPI

# Publishes on a version tag using PyPI Trusted Publishing (OIDC).
# No API token is stored anywhere: GitHub mints a short-lived credential that
# PyPI accepts only for this repo + this workflow file. Added 2026-07-19 after
# three manual tokens were created and lost in a single day.
#
# One-time setup on PyPI (pypi.org -> your project -> Publishing):
#   Owner: Fulcrum-Enterprises   Repository: verify-proof
#   Workflow: release.yml        Environment: (leave blank)
#
# One-time setup on npm (npmjs.com -> verify-proof -> Settings -> Trusted Publisher),
# added 2026-10-15 so the Node port ships from the same tag:
#   Publisher: GitHub Actions   Owner: Fulcrum-Enterprises   Repository: verify-proof
#   Workflow: release.yml       Environment: (leave blank)   Allow npm publish: ticked
#
# To ship a release:
#   1. bump `version` in pyproject.toml (and server.json if the MCP entry changed);
#      bump js/package.json too if the Node port changed (the npm job skips when
#      the version there is already on the registry, so Python-only tags are fine)
#   2. git tag v0.2.2 && git push --tags

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Guard against tagging one version and shipping another. PyPI will not
      # let a version be re-uploaded, so a mismatch here is expensive to undo.
      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PKG"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # The MCP registry verifies PyPI ownership via this marker in the package
      # README. If it is missing from the built metadata the registry publish
      # will fail later, so fail here instead where it is cheap to fix.
      - name: Verify mcp-name ownership marker is in built metadata
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          z = zipfile.ZipFile(whl)
          meta = next(n for n in z.namelist() if n.endswith("METADATA"))
          text = z.read(meta).decode("utf-8")
          marker = "mcp-name: io.github.csolomon0704-prog/verify-proof"
          if marker not in text:
              sys.exit(f"::error::{marker!r} missing from {whl} METADATA")
          print("ownership marker present")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish the Node port to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm Trusted Publishing (OIDC) + provenance
      contents: read
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # npm 11.5+ is needed for OIDC publishing
          registry-url: https://registry.npmjs.org

      - name: Test
        run: node test.js

      # A tag that only changes the Python package must not fail here: skip when
      # js/package.json's version is already on the registry.
      - name: Decide whether this version is new
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view verify-proof version 2>/dev/null || echo none)
          echo "local=$LOCAL remote=$REMOTE"
          if [ "$LOCAL" = "$REMOTE" ]; then echo "publish=no" >> "$GITHUB_OUTPUT"; else echo "publish=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Publish with provenance
        if: steps.check.outputs.publish == 'yes'
        run: npm publish --provenance --access public
